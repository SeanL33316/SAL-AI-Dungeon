name: SAL v1.3.5 full audit fix

on:
  push:
    paths:
      - '.github/workflows/sal-v1.3.5-full-audit-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited SAL fixes
        run: python3 .github/scripts/sal_135_patch.py

      - name: Verify all JavaScript
        run: |
          set -euo pipefail
          node --check SAL-only/library.js
          node --check SAL-only/input.js
          node --check SAL-only/context.js
          node --check SAL-only/output.js
          node --check src/library.js
          node --check src/input.js
          node --check src/context.js
          node --check src/output.js

      - name: Test full SAL lifecycle and late refresh
        run: node .github/scripts/test_sal_135.js

      - name: Verify combined and standalone synchronization
        run: python3 .github/scripts/verify_sal_sync.py

      - name: Commit SAL v1.3.5
        run: |
          set -euo pipefail
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add SAL-only src README.md
          git commit -m 'Fix late SAL refresh generation and parser'
          git push

# rerun after internal version patch fix
