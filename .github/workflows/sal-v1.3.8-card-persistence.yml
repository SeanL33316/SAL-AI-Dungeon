name: SAL v1.3.8 card persistence

on:
  push:
    paths:
      - '.github/workflows/sal-v1.3.8-card-persistence.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply SAL v1.3.8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(text, start_marker, end_marker, new_block, label):
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f'{label}: start marker missing')
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError(f'{label}: end marker missing')
              return text[:start] + new_block.rstrip() + '\n\n' + text[end:]

          card_helpers = r'''function SAL_ensureCard(keys, entry) {
            let index = SAL_findCardIndex(keys);
            if (index >= 0) return index;

            try {
              const added = addStoryCard(keys, String(entry || ""), SAL_CARD_TYPE);
              if (Number.isInteger(added)) {
                index = added;
              } else if (added && typeof added === "object" && Array.isArray(storyCards)) {
                index = storyCards.indexOf(added);
              }
            } catch (error) {
              try { log("SAL addStoryCard failed: " + error); } catch (_) {}
            }

            // Current Phoenix builds do not guarantee that addStoryCard returns an
            // array index. Always rediscover the card from storyCards after creation.
            if (!Number.isInteger(index) || index < 0) index = SAL_findCardIndex(keys);
            return Number.isInteger(index) ? index : -1;
          }

          function SAL_updateCard(keys, entry) {
            const value = String(entry || "");
            const index = SAL_ensureCard(keys, value);
            if (!Number.isInteger(index) || index < 0 || !Array.isArray(storyCards)) return false;

            const card = storyCards[index];
            if (!card || typeof card !== "object") return false;

            // Inner Self / Auto-Cards persist Story Card changes by mutating the
            // live storyCards object. Use the same proven path first on Phoenix.
            try {
              card.keys = keys;
              card.entry = value;
              card.type = SAL_CARD_TYPE;
              if (typeof card.title !== "string" || !card.title.trim()) card.title = keys;
              if (String(card.entry || "") === value) return true;
            } catch (error) {
              try { log("SAL direct Story Card update failed: " + error); } catch (_) {}
            }

            // Compatibility fallback for sandboxes that prefer the helper API.
            try {
              if (typeof updateStoryCard === "function") {
                updateStoryCard(index, keys, value, SAL_CARD_TYPE);
                return true;
              }
            } catch (error) {
              try { log("SAL updateStoryCard fallback failed: " + error); } catch (_) {}
            }
            return false;
          }'''

          migrate = r'''function SAL_migrateLegacyCard(oldKeys, newKeys) {
            const oldIndex = SAL_findCardIndex(oldKeys);
            if (oldIndex < 0 || SAL_findCardIndex(newKeys) >= 0) return;

            const card = storyCards[oldIndex];
            if (!card || typeof card !== "object") return;
            const entry = String(card.entry || "");
            const type = card.type || SAL_CARD_TYPE;

            // Prefer the same live-object mutation used by Inner Self / Auto-Cards.
            try {
              card.keys = newKeys;
              card.entry = entry;
              card.type = type;
              if (card.title === oldKeys) card.title = newKeys;
              if (SAL_findCardIndex(newKeys) >= 0) return;
            } catch (_) {}

            try {
              if (typeof updateStoryCard === "function") {
                updateStoryCard(oldIndex, newKeys, entry, type);
              }
            } catch (error) {
              try { log("SAL legacy Story Card migration failed: " + error); } catch (_) {}
            }
          }'''

          sync = r'''function SAL_syncCards() {
            const s = SAL_state();
            SAL_migrateLegacyCards();

            const settingsIndex = SAL_ensureCard(SAL_SETTINGS_KEYS, SAL_settingsText());
            if (settingsIndex >= 0) {
              SAL_parseSettings(storyCards[settingsIndex]?.entry);
            }

            const arcIndex = SAL_ensureCard(SAL_ARC_KEYS, s.arc);
            let cardArc = "";
            const stateArc = String(s.arc || "").trim();

            if (arcIndex >= 0) {
              cardArc = String(storyCards[arcIndex]?.entry || "").trim();

              if (!cardArc && stateArc) {
                // A valid generated arc in persistent state must not be erased just
                // because Phoenix returned an unexpectedly blank Story Card entry.
                // Repair the visible card from state instead.
                const repaired = SAL_updateCard(SAL_ARC_KEYS, s.arc);
                const repairedIndex = SAL_findCardIndex(SAL_ARC_KEYS);
                cardArc = repairedIndex >= 0
                  ? String(storyCards[repairedIndex]?.entry || "").trim()
                  : "";
                s.lastCardSyncStatus = repaired && cardArc === stateArc
                  ? "repaired blank card from SAL state"
                  : "repair failed";
              } else if (cardArc && cardArc !== stateArc) {
                // Non-empty edits are intentional user edits and remain supported.
                s.arc = cardArc;
                s.lastCardSyncStatus = stateArc
                  ? "adopted manual Story Card edit"
                  : "loaded arc from Story Card";
              } else {
                s.lastCardSyncStatus = stateArc ? "synced" : "empty (no arc yet)";
              }
            } else {
              s.lastCardSyncStatus = "card unavailable";
            }

            // Timing migration: do not surprise an existing story with an
            // immediate refresh. New/no-arc stories wait for the 10-turn observation
            // period; stories that already have an arc get a full refresh interval.
            if (s.timingVersion < 2) {
              const effectiveArc = String(s.arc || "").trim();
              s.nextArcTurn = effectiveArc
                ? s.turn + s.turnsPerAICall
                : Math.max(SAL_INITIAL_WAIT_TURNS, s.turn);
              s.timingVersion = 2;
            }
          }'''

          for file_name in ['SAL-only/1-Library.js', 'src/1-Library.js']:
              path = Path(file_name)
              text = path.read_text()
              text = text.replace('SAL v1.3.7', 'SAL v1.3.8')
              text = text.replace('v1.3.7\n', 'v1.3.8\n')
              text = text.replace('const SAL_VERSION = "1.3.7";', 'const SAL_VERSION = "1.3.8";')

              state_marker = '  if (typeof s.lastPlanningOutputPreview !== "string") s.lastPlanningOutputPreview = "";\n'
              if state_marker not in text:
                  raise RuntimeError(file_name + ': state marker missing')
              text = text.replace(
                  state_marker,
                  state_marker + '  if (typeof s.lastCardSyncStatus !== "string") s.lastCardSyncStatus = "not checked";\n',
                  1
              )

              text = replace_between(
                  text,
                  'function SAL_ensureCard(keys, entry) {',
                  'function SAL_migrateLegacyCard(oldKeys, newKeys) {',
                  card_helpers,
                  file_name + ' card helpers'
              )
              text = replace_between(
                  text,
                  'function SAL_migrateLegacyCard(oldKeys, newKeys) {',
                  'function SAL_migrateLegacyCards() {',
                  migrate,
                  file_name + ' migration'
              )
              text = replace_between(
                  text,
                  'function SAL_syncCards() {',
                  'function SAL_saveSettings() {',
                  sync,
                  file_name + ' sync'
              )

              status_marker = '    `Story Arc exists: ${hasArc ? "yes" : "no"}`,\n'
              if status_marker not in text:
                  raise RuntimeError(file_name + ': status marker missing')
              text = text.replace(
                  status_marker,
                  status_marker + '    `Story Arc card sync: ${s.lastCardSyncStatus}`,\n',
                  1
              )
              path.write_text(text)

          readme = Path('README.md')
          text = readme.read_text().replace('**Story Arc Light (SAL) v1.3.7**', '**Story Arc Light (SAL) v1.3.8**')
          old = '4. **The result is stored in the `Current Story Arc` Story Card.** This lets the user inspect or manually edit the current possibilities.'
          new = '4. **The result is stored in the `Current Story Arc` Story Card.** This lets the user inspect or manually edit the current possibilities. SAL mirrors successful arcs directly into the live Story Card object; if Phoenix unexpectedly returns that card with a blank entry while SAL still has a valid saved arc, SAL repairs the card from its persistent state instead of deleting the arc.'
          if old not in text:
              raise RuntimeError('README Story Card paragraph missing')
          text = text.replace(old, new, 1)
          readme.write_text(text)
          PY

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check SAL-only/1-Library.js
          node --check src/1-Library.js

      - name: Test Story Arc card persistence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          global.state = {};
          global.storyCards = [];
          global.history = [];
          global.info = { maxChars: 6000, memoryLength: 500, actionCount: 0 };
          global.log = () => {};

          // Simulate Phoenix behavior where addStoryCard may not return an index.
          global.addStoryCard = (keys, entry = '', type = '') => {
            storyCards.push({ keys, entry, type, title: keys, description: '' });
            return undefined;
          };

          // Deliberately make updateStoryCard useless. v1.3.8 must persist by
          // mutating the live card object, like Inner Self / Auto-Cards do.
          global.updateStoryCard = () => undefined;
          global.removeStoryCard = index => storyCards.splice(index, 1);

          vm.runInThisContext(fs.readFileSync('SAL-only/1-Library.js', 'utf8'));
          assert.equal(SAL_VERSION, '1.3.8');

          const settingsIndex = SAL_findCardIndex(SAL_SETTINGS_KEYS);
          const arcIndex = SAL_findCardIndex(SAL_ARC_KEYS);
          assert.ok(settingsIndex >= 0, 'SAL Settings card should be discoverable after addStoryCard returns undefined');
          assert.ok(arcIndex >= 0, 'Current Story Arc card should be discoverable after addStoryCard returns undefined');

          const generated = [
            '1. Meet a coworker after the morning briefing',
            '2. Explore a nearby neighborhood after work',
            '3. Handle an unexpected client request calmly',
            '4. Learn more about a familiar neighbor',
            '5. Make plans for a quiet weekend outing',
            '6. Notice a small change at the office',
            '7. Receive an invitation from an acquaintance',
            '8. Discover a useful local routine'
          ].join('\n');

          const result = SAL_processGeneratedOutput(generated);
          assert.ok(result.includes('8 possibilities'));
          const s = SAL_state();
          const savedArc = s.arc;
          assert.ok(savedArc.includes('OPTIONAL STORY ARC LIGHT POSSIBILITIES:'));
          assert.equal(storyCards[SAL_findCardIndex(SAL_ARC_KEYS)].entry, savedArc, 'successful generation must immediately populate the visible card');

          // Simulate the reported Phoenix desync: state still contains a valid
          // arc but the visible Story Card comes back blank on the next hook.
          storyCards[SAL_findCardIndex(SAL_ARC_KEYS)].entry = '';
          SAL_syncCards();
          assert.equal(s.arc, savedArc, 'blank card must not erase a valid saved state arc');
          assert.equal(storyCards[SAL_findCardIndex(SAL_ARC_KEYS)].entry, savedArc, 'blank card should be repaired from state');
          assert.equal(s.lastCardSyncStatus, 'repaired blank card from SAL state');

          // Non-empty manual edits must still be respected.
          const manualArc = 'OPTIONAL STORY ARC LIGHT POSSIBILITIES:\n1. User manually changes the first direction';
          storyCards[SAL_findCardIndex(SAL_ARC_KEYS)].entry = manualArc;
          SAL_syncCards();
          assert.equal(s.arc, manualArc);
          assert.equal(s.lastCardSyncStatus, 'adopted manual Story Card edit');

          // Existing parser behavior remains intact.
          assert.equal(SAL_extractArcResult(generated).count, 8);
          assert.equal(SAL_extractArcResult('OK').count, 0);
          assert.ok(SAL_statusText().includes('Story Arc card sync:'));

          console.log('SAL v1.3.8 Story Arc card persistence tests passed');
          NODE

      - name: Verify combined SAL core matches standalone
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          standalone = Path('SAL-only/1-Library.js').read_text().strip()
          combined = Path('src/1-Library.js').read_text()
          marker = '// SAL — STORY ARC LIGHT — AI DUNGEON LIBRARY — v1.3.8'
          start = combined.find(marker)
          if start < 0:
              raise SystemExit('combined SAL marker missing')
          start = combined.rfind('// ============================================================================', 0, start + 1)
          combined_sal = combined[start:].strip()
          if combined_sal != standalone:
              raise SystemExit('combined SAL core differs from standalone')
          PY

      - name: Commit SAL v1.3.8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add SAL-only/1-Library.js src/1-Library.js README.md
          git commit -m 'Persist SAL arcs through live Story Card objects'
          git push
