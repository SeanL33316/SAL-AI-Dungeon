name: SAL 1.3.10 action priority validation
# Verification rerun after handling truncated Recent Story headings
on:
  push:
    paths:
      - '.github/workflows/sal-1310-action-priority-test.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and combined core
        run: |
          for script in SAL-only/*.js src/*.js; do node --check "$script"; done
          python3 - <<'PY'
          from pathlib import Path
          standalone=Path('SAL-only/1-Library.js').read_text()
          combined=Path('src/1-Library.js').read_text()
          assert combined.endswith(standalone), 'combined and standalone SAL differ'
          assert 'Story Arc Light (SAL) v1.3.10' in combined
          assert 'const SAL_VERSION = "1.3.10"' in standalone
          print('Source synchronisation and syntax checks passed')
          PY
      - name: Run action-priority regression tests
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');
          global.state={};
          global.storyCards=[];
          global.history=[];
          global.info={maxChars:6200,memoryLength:120,actionCount:12};
          global.log=()=>{};
          global.addStoryCard=(keys,entry,type)=>{
            storyCards.push({keys,entry,type,title:keys,description:''});
          };
          global.updateStoryCard=(index,keys,entry,type)=>{
            Object.assign(storyCards[index],{keys,entry,type});
          };
          vm.runInThisContext(fs.readFileSync('SAL-only/1-Library.js','utf8'));
          assert.equal(SAL_VERSION,'1.3.10');
          const s=SAL_state();
          const original='Plot Essentials: modern Tokyo slice of life\nRecent Story:\nA conversation at a cafe.\n> You say, "Let\'s go to Akihabara."';
          assert.equal(SAL_injectArc(original),original,'no arc must leave story unchanged');
          const arc=Array.from({length:8},(_,i)=>(i+1)+'. Optional neighborhood event unfolds naturally').join('\n');
          assert.match(SAL_processGeneratedOutput(arc),/SAL updated \(8\/8\)/);
          for(const kind of ['say','do','story']){
            const player={
              say:'> You say, "Let\'s go to Akihabara."',
              do:'> You suggest taking the next train to Akihabara.',
              story:'You ask Hana to visit a neighborhood bookstore.'
            }[kind];
            SAL_protectPlayerInput(player);
            assert.equal(s.realPlayerInputThisTurn,true);
            const preamble='Plot Essentials: modern Tokyo slice of life\n';
            const recent='Recent Story:\nThe two discuss their next plans.\n[Author\'s note: player actions have priority.]\n'+player;
            const context=preamble+recent;
            info.memoryLength=preamble.length;
            info.maxChars=9000;
            const result=SAL_injectArc(context);
            const indexArc=result.indexOf('<<STORY ARC LIGHT — OPTIONAL GUIDANCE>>');
            const indexRecent=result.indexOf('Recent Story:');
            const indexPlayer=result.lastIndexOf(player);
            assert.ok(indexArc>=0 && indexArc<indexRecent && indexRecent<indexPlayer,kind+' bad order');
            assert.ok(result.endsWith(player),kind+' last input not at end');
            assert.equal((result.match(/<<STORY ARC LIGHT — OPTIONAL GUIDANCE>>/g)||[]).length,1);
            assert.ok(result.length<=info.maxChars);
            assert.ok(result.includes('Respond to the player\'s newest action or dialogue in this very next response.'));
            const second=SAL_injectArc(result);
            assert.equal((second.match(/<<STORY ARC LIGHT — OPTIONAL GUIDANCE>>/g)||[]).length,1,kind+' duplicated arc');
            assert.ok(second.endsWith(player),kind+' changed latest input on repeated context hook');
          }
          const preamble='Plot Essentials: modern Tokyo slice of life\n';
          const player='> You say, "We should go somewhere new."';
          const hugeContext=preamble+'Recent Story:\n'+('Old scene details. '.repeat(1500))+'\n[Author\'s note: respond naturally.]\n'+player;
          info.memoryLength=preamble.length;
          info.maxChars=6200;
          const longResult=SAL_injectArc(hugeContext);
          assert.ok(longResult.length<=info.maxChars,'long context overflow');
          assert.ok(longResult.includes('<<STORY ARC LIGHT — OPTIONAL GUIDANCE>>'));
          assert.ok(longResult.indexOf('<<END STORY ARC LIGHT>>')<longResult.indexOf('Recent Story:'),'arc inserted too late');
          assert.ok(longResult.endsWith(player),'latest input was truncated');
          const noHeader=preamble+'Earlier conversation\n'+player;
          const fallback=SAL_injectArc(noHeader);
          assert.ok(fallback.endsWith(player),'no-heading fallback dropped latest action');
          assert.ok(fallback.indexOf('<<END STORY ARC LIGHT>>')<fallback.indexOf(player));
          s.pendingGeneration=true;
          s.captureGeneration=true;
          const planning=SAL_generationContext(hugeContext);
          assert.ok(planning.length<=info.maxChars);
          assert.ok(planning.includes('STORY ARC LIGHT — PRIVATE PLANNING TASK'),'planning prompt truncated');
          assert.ok(s.lastPlanningPromptAttached);
          console.log('Say, Do, Story, repeat-injection, long-context, fallback and private-planning tests passed');
          NODE
