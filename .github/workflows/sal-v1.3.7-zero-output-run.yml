name: SAL v1.3.7 corrected run

on:
  push:
    paths:
      - '.github/workflows/sal-v1.3.7-zero-output-run.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply SAL v1.3.7 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src = Path('.github/workflows/sal-v1.3.7-zero-output-fix.yml').read_text()
          begin = "          python3 - <<'PY'\n"
          start = src.index(begin) + len(begin)
          end = src.index("\n          PY\n", start)
          patch = textwrap.dedent(src[start:end])
          Path('/tmp/sal137patch.py').write_text(patch)
          PY
          python3 /tmp/sal137patch.py

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in SAL-only/1-Library.js SAL-only/2-Input.js SAL-only/3-Context.js SAL-only/4-Output.js src/1-Library.js src/2-Input.js src/3-Context.js src/4-Output.js; do
            node --check "$f"
          done

      - name: Test zero-output hardening
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          global.state = {};
          global.storyCards = [];
          global.history = [];
          global.info = { maxChars: 6000, memoryLength: 500, actionCount: 100 };
          global.log = () => {};
          global.addStoryCard = (keys, entry, type) => { storyCards.push({ keys, entry, type }); return storyCards.length - 1; };
          global.updateStoryCard = (i, keys, entry, type) => { storyCards[i] = { ...storyCards[i], keys, entry, type }; };
          global.removeStoryCard = i => storyCards.splice(i, 1);
          vm.runInThisContext(fs.readFileSync('SAL-only/1-Library.js', 'utf8'));

          assert.equal(SAL_VERSION, '1.3.7');
          assert.equal(SAL_state().promptVersion, 3);
          assert.ok(SAL_state().prompt.includes('PRIVATE PLANNING TASK'));
          assert.ok(!SAL_state().prompt.startsWith('<<'));

          function arc(n) { return Array.from({length:n}, (_,i) => `${i+1}. possibility ${i+1} develops naturally`).join('\n'); }
          assert.equal(SAL_extractArcResult(arc(5)).count, 5);
          assert.equal(SAL_extractArcResult('Option 1:Meet coworkers\nOption 2:Explore district\nOption 3:Handle client issue\nOption 4:Meet neighbor\nOption 5:Weekend outing').count, 5);
          assert.equal(SAL_extractArcResult('1)Meet coworkers\n2)Explore district\n3)Handle client issue\n4)Meet neighbor\n5)Weekend outing').count, 5);
          assert.equal(SAL_extractArcResult('OK').count, 0);

          const base = 'M'.repeat(500) + 'Recent Story:\n' + 'story '.repeat(900);
          const planned = SAL_generationContext(base);
          assert.ok(planned.includes('PRIVATE PLANNING TASK'));
          assert.ok(planned.length <= info.maxChars);
          assert.equal(SAL_state().lastPlanningPromptAttached, true);
          assert.equal(SAL_state().lastPlanningContextLength, planned.length);

          const s = SAL_state();
          s.turn = 100;
          s.arc = '';
          const failure = SAL_processGeneratedOutput('OK');
          assert.ok(failure.includes('0/8'));
          assert.equal(s.lastPlanningOutputLength, 2);
          assert.equal(s.lastPlanningOutputPreview, 'OK');
          const status = SAL_statusText();
          assert.ok(status.includes('Planning prompt attached: yes'));
          assert.ok(status.includes('Last planning output preview: OK'));

          const success = SAL_processGeneratedOutput(arc(7));
          assert.ok(success.includes('7 possibilities'));
          assert.equal(s.lastArcGenerationStatus, 'success (7 possibilities)');
          console.log('SAL v1.3.7 corrected tests passed');
          NODE

      - name: Verify combined SAL core
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          standalone = Path('SAL-only/1-Library.js').read_text().strip()
          combined = Path('src/1-Library.js').read_text()
          marker = '// SAL — STORY ARC LIGHT — AI DUNGEON LIBRARY — v1.3.7'
          pos = combined.find(marker)
          if pos < 0: raise SystemExit('combined marker missing')
          start = combined.rfind('// ============================================================================', 0, pos + 1)
          if combined[start:].strip() != standalone: raise SystemExit('combined SAL core differs')
          PY

      - name: Commit SAL v1.3.7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add SAL-only src README.md
          git commit -m 'Harden SAL private planning and expose zero-output diagnostics'
          git push
