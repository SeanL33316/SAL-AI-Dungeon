name: Fix SAL v1.3.7 test

on:
  push:
    paths:
      - '.github/workflows/fix-sal-137-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix zero-item test and rerun updater
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/sal-v1.3.7-zero-output-fix.yml')
          t = p.read_text()
          old = "assert.equal(SAL_extractArcResult('You step outside and head toward the station. The morning is quiet.').count, 0);"
          new = "assert.equal(SAL_extractArcResult('OK').count, 0);"
          if old not in t:
              raise SystemExit('test marker not found')
          p.write_text(t.replace(old, new, 1))
          PY
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add .github/workflows/sal-v1.3.7-zero-output-fix.yml
          git commit -m 'Fix SAL 1.3.7 zero-output test case'
          git push
