name: Sync SAL Story Card names

on:
  push:
    paths:
      - '.github/workflows/sync-sal-card-names.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply SAL v1.3.1 naming fix
        shell: python
        run: |
          from pathlib import Path

          migration = '''function SAL_migrateLegacyCard(oldKeys, newKeys) {
            const oldIndex = SAL_findCardIndex(oldKeys);
            if (oldIndex < 0 || SAL_findCardIndex(newKeys) >= 0) return;

            const card = storyCards[oldIndex];
            const entry = String(card?.entry || "");
            const type = card?.type || SAL_CARD_TYPE;

            try {
              updateStoryCard(oldIndex, newKeys, entry, type);
            } catch (_) {
              try {
                storyCards[oldIndex].keys = newKeys;
                storyCards[oldIndex].entry = entry;
                storyCards[oldIndex].type = type;
              } catch (error) {
                log("SAL legacy Story Card migration failed: " + error);
              }
            }
          }

          function SAL_migrateLegacyCards() {
            SAL_migrateLegacyCard(SAL_LEGACY_SETTINGS_KEYS, SAL_SETTINGS_KEYS);
            SAL_migrateLegacyCard(SAL_LEGACY_ARC_KEYS, SAL_ARC_KEYS);
          }

          '''

          for name in ['input.js', 'context.js', 'output.js']:
              path = Path('src') / name
              text = path.read_text()
              text = text.replace('v1.3.0', 'v1.3.1')
              text = text.replace('const SAL_VERSION = "1.3.0";', 'const SAL_VERSION = "1.3.1";')
              text = text.replace(
                  'const SAL_SETTINGS_KEYS = "/SAL Settings";\nconst SAL_ARC_KEYS = "/Current Story Arc";',
                  'const SAL_SETTINGS_KEYS = "SAL Settings";\nconst SAL_ARC_KEYS = "Current Story Arc";\nconst SAL_LEGACY_SETTINGS_KEYS = "/SAL Settings";\nconst SAL_LEGACY_ARC_KEYS = "/Current Story Arc";'
              )
              if 'function SAL_migrateLegacyCard(' not in text:
                  text = text.replace('function SAL_settingsText() {', migration + 'function SAL_settingsText() {')
              text = text.replace(
                  'function SAL_syncCards() {\n  const s = SAL_state();',
                  'function SAL_syncCards() {\n  const s = SAL_state();\n  SAL_migrateLegacyCards();'
              )
              text = text.replace(
                  'SAL is disabled. Set enabled = true in /SAL Settings.',
                  'SAL is disabled. Set enabled = true in the SAL Settings Story Card.'
              )
              path.write_text(text)

          p = Path('src/library.js')
          text = p.read_text().replace('Story Arc Light (SAL) v1.3.0', 'Story Arc Light (SAL) v1.3.1')
          p.write_text(text)

          for name in ['input.js', 'context.js', 'output.js']:
              p = Path('SAL-only') / name
              p.write_text(p.read_text().replace('v1.3.0', 'v1.3.1'))

          p = Path('README.md')
          text = p.read_text().replace('SAL) v1.3.0', 'SAL) v1.3.1')
          text = text.replace('`/SAL Settings` and `/Current Story Arc` Story Cards', '`SAL Settings` and `Current Story Arc` Story Cards')
          p.write_text(text)

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check SAL-only/library.js
          node --check SAL-only/input.js
          node --check SAL-only/context.js
          node --check SAL-only/output.js
          node --check src/library.js
          node --check src/input.js
          node --check src/context.js
          node --check src/output.js
          grep -q 'const SAL_SETTINGS_KEYS = "SAL Settings";' src/input.js
          grep -q 'SAL_migrateLegacyCards();' src/context.js
          grep -q 'const SAL_VERSION = "1.3.1";' src/output.js

      - name: Commit synchronized fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add src SAL-only README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Sync SAL v1.3.1 Story Card naming fix'
          git push
