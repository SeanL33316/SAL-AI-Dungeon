name: Run stricter SAL v1.3.3 command parser

on:
  push:
    paths:
      - '.github/workflows/run-sal-v1.3.3-command-fix2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build corrected SAL command handling
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          wf = Path('.github/workflows/sal-v1.3.3-command-fix.yml').read_text()
          start = wf.index("          python3 - <<'PY'\n") + len("          python3 - <<'PY'\n")
          end = wf.index("\n          PY\n", start)
          code = textwrap.dedent(wf[start:end])
          code = code.replace(
              "text = text.replace('v1.3.2', 'v1.3.3')",
              "text = text.replace('v1.3.2', 'v1.3.3')\n    text = text.replace('const SAL_VERSION = \\\"1.3.2\\\";', 'const SAL_VERSION = \\\"1.3.3\\\";')"
          )
          exec(compile(code, '<sal-command-patch>', 'exec'))

          # Tighten generated Do/Say wrapper patterns so ordinary prose that
          # mentions a command is not intercepted. AI Dungeon actor wrappers
          # use You or a character name, which are title/name-style tokens.
          for p in [Path('SAL-only/library.js'), Path('src/library.js')]:
              text = p.read_text()
              old_say = 'let match = raw.match(/^>\\s+.+?\\s+(?:say|says),?\\s*["“](\\/[^"”]+)["”]$/i);'
              new_say = 'let match = raw.match(/^>\\s+(?:[A-Z][A-Za-z0-9_.\'’\\-]*(?:\\s+[A-Z][A-Za-z0-9_.\'’\\-]*){0,4})\\s+[Ss]ay(?:s)?,?\\s*["“](\\/[^"”]+)["”]$/);'
              old_do = 'match = raw.match(/^>\\s+([A-Za-z0-9_.\'’\\-]+(?:\\s+[A-Za-z0-9_.\'’\\-]+){0,4})\\s+(\\/.+)$/i);'
              new_do = 'match = raw.match(/^>\\s+([A-Z][A-Za-z0-9_.\'’\\-]*(?:\\s+[A-Z][A-Za-z0-9_.\'’\\-]*){0,4})\\s+(\\/.+)$/);'
              if old_say not in text or old_do not in text:
                  raise RuntimeError(f'wrapper regex not found in {p}')
              p.write_text(text.replace(old_say, new_say, 1).replace(old_do, new_do, 1))

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in SAL-only/library.js SAL-only/input.js SAL-only/context.js SAL-only/output.js src/library.js src/input.js src/context.js src/output.js; do node --check "$f"; done

      - name: Run complete command matrix
        shell: python
        run: |
          from pathlib import Path
          import textwrap, subprocess
          wf = Path('.github/workflows/sal-v1.3.3-command-fix.yml').read_text()
          marker = "          cat > /tmp/test-sal-commands.js <<'NODE'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("\n          NODE\n", start)
          Path('/tmp/test-sal-commands.js').write_text(textwrap.dedent(wf[start:end]))
          subprocess.run(['node', '/tmp/test-sal-commands.js'], check=True)

      - name: Commit tested SAL v1.3.3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add SAL-only src README.md
          git commit -m 'Fix SAL commands across AI Dungeon input modes'
          git push
