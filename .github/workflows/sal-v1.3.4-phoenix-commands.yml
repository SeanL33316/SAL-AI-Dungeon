name: SAL v1.3.4 Phoenix commands

on:
  push:
    paths:
      - '.github/workflows/sal-v1.3.4-phoenix-commands.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Phoenix-safe command handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          libraries = [Path('SAL-only/library.js'), Path('src/library.js')]

          old_protect = '''function SAL_protectPlayerInput(inputText) {\n  const s = SAL_state();\n\n  // Clear only a previous SAL-owned command message. Never erase messages\n  // created by another script such as Inner Self or Auto-Cards.\n  if (s.commandMessageActive && state.message === s.commandMessage) {\n    delete state.message;\n  }\n  s.commandMessageActive = false;\n  s.commandMessage = "";\n  s.inputStop = false;\n\n  const realInput = SAL_isRealPlayerInput(inputText);\n  const command = SAL_isCommand(inputText);\n  s.realPlayerInputThisTurn = realInput;\n  s.innerSelfTaskActive = false;\n\n  if (!realInput) {\n    // Only a real Continue-like empty turn resumes a deferred automatic refresh.\n    // SAL commands such as /sal status must never accidentally restart it.\n    if (!command && s.deferred && s.enabled && !SAL_isBusy()) {\n      s.pendingGeneration = true;\n      s.captureGeneration = true;\n      s.generationReason = "auto";\n      s.deferred = false;\n    }\n    return;\n  }\n\n  if (SAL_isBusy()) {\n    s.pendingGeneration = false;\n    s.captureGeneration = false;\n    s.attempt = 0;\n    s.deferred = true;\n    s.generationReason = "auto";\n  }\n\n  if (SAL_hasInnerSelfTask()) {\n    state.InnerSelf.agent = "";\n  }\n}\n\nfunction SAL_setCommandMessage(message) {\n  const s = SAL_state();\n  const clean = String(message || "");\n  s.inputStop = true;\n  s.commandMessage = clean;\n  s.commandMessageActive = true;\n  state.message = clean;\n}\n'''

          new_protect = '''function SAL_protectPlayerInput(inputText) {\n  const s = SAL_state();\n\n  // Recover cleanly if a previous command turn was interrupted before Output.\n  s.commandPending = false;\n  s.commandResponse = "";\n  s.inputStop = false; // legacy v1.3.3 state; no longer used on Phoenix\n  s.commandMessageActive = false;\n  s.commandMessage = "";\n\n  const realInput = SAL_isRealPlayerInput(inputText);\n  const command = SAL_isCommand(inputText);\n  s.realPlayerInputThisTurn = realInput;\n  s.innerSelfTaskActive = false;\n\n  if (!realInput) {\n    // Only a real Continue-like empty turn resumes a deferred automatic refresh.\n    // SAL commands must never accidentally restart it.\n    if (!command && s.deferred && s.enabled && !SAL_isBusy()) {\n      s.pendingGeneration = true;\n      s.captureGeneration = true;\n      s.generationReason = "auto";\n      s.deferred = false;\n    }\n    return;\n  }\n\n  if (SAL_isBusy()) {\n    s.pendingGeneration = false;\n    s.captureGeneration = false;\n    s.attempt = 0;\n    s.deferred = true;\n    s.generationReason = "auto";\n  }\n\n  if (SAL_hasInnerSelfTask()) {\n    state.InnerSelf.agent = "";\n  }\n}\n\nfunction SAL_queueDisplayCommand(message) {\n  const s = SAL_state();\n  s.commandPending = true;\n  s.commandResponse = String(message || "SAL command completed.");\n  s.realPlayerInputThisTurn = false;\n  s.innerSelfTaskActive = false;\n  // Phoenix currently errors on empty Input text and on stop:true. A zero-width\n  // character is a valid non-empty placeholder and is swallowed on Output.\n  return "\\u200B";\n}\n'''

          old_commands = '''function SAL_inputCommands(inputText) {\n  const s = SAL_state();\n  const t = SAL_normalizeCommand(inputText);\n\n  if (t === "/sal" || t === "/sal status") {\n    s.showStatus = false;\n    SAL_setCommandMessage(SAL_statusText());\n    return null;\n  }\n\n  if (t === "/sal help") {\n    s.showStatus = false;\n    SAL_setCommandMessage(SAL_helpText());\n    return null;\n  }\n\n  if (t === "/sal redo" || t === "/sal refresh" || t === "/redo arc") {\n    if (!s.enabled) {\n      s.pendingMessage = "SAL is disabled. Set enabled = true in the SAL Settings Story Card.";\n      return " ";\n    }\n    s.pendingGeneration = true;\n    s.captureGeneration = true;\n    s.generationReason = "manual";\n    s.deferred = false;\n    s.attempt = 0;\n    return " ";\n  }\n\n  if (t === "/sal stop" || t === "/stop") {\n    const wasPending = SAL_isBusy() || s.deferred;\n    s.pendingGeneration = false;\n    s.captureGeneration = false;\n    s.deferred = false;\n    s.generationReason = "";\n    s.attempt = 0;\n    s.pendingMessage = "";\n    SAL_setCommandMessage(\n      wasPending\n        ? "Story Arc Light generation stopped."\n        : "No Story Arc Light generation is currently pending."\n    );\n    return null;\n  }\n\n  return inputText;\n}\n'''

          new_commands = '''function SAL_inputCommands(inputText) {\n  const s = SAL_state();\n  const t = SAL_normalizeCommand(inputText);\n\n  if (t === "/sal" || t === "/sal status") {\n    s.showStatus = false;\n    return SAL_queueDisplayCommand(SAL_statusText());\n  }\n\n  if (t === "/sal help") {\n    s.showStatus = false;\n    return SAL_queueDisplayCommand(SAL_helpText());\n  }\n\n  if (t === "/sal redo" || t === "/sal refresh" || t === "/redo arc") {\n    if (!s.enabled) {\n      return SAL_queueDisplayCommand(\n        "SAL is disabled. Set enabled = true in the SAL Settings Story Card."\n      );\n    }\n    s.commandPending = false;\n    s.commandResponse = "";\n    s.pendingGeneration = true;\n    s.captureGeneration = true;\n    s.generationReason = "manual";\n    s.deferred = false;\n    s.attempt = 0;\n    return "\\u200B";\n  }\n\n  if (t === "/sal stop" || t === "/stop") {\n    const wasPending = SAL_isBusy() || s.deferred;\n    s.pendingGeneration = false;\n    s.captureGeneration = false;\n    s.deferred = false;\n    s.generationReason = "";\n    s.attempt = 0;\n    s.pendingMessage = "";\n    return SAL_queueDisplayCommand(\n      wasPending\n        ? "Story Arc Light generation stopped."\n        : "No Story Arc Light generation is currently pending."\n    );\n  }\n\n  return inputText;\n}\n'''

          for path in libraries:
              text = path.read_text()
              text = text.replace('v1.3.3', 'v1.3.4')
              text = text.replace('const SAL_VERSION = "1.3.3";', 'const SAL_VERSION = "1.3.4";')
              text = replace_once(
                  text,
                  '  if (typeof s.commandMessage !== "string") s.commandMessage = "";\n',
                  '  if (typeof s.commandMessage !== "string") s.commandMessage = "";\n  if (typeof s.commandPending !== "boolean") s.commandPending = false;\n  if (typeof s.commandResponse !== "string") s.commandResponse = "";\n',
                  f'{path}: command state'
              )
              text = replace_once(text, old_protect, new_protect, f'{path}: protect/queue')
              text = replace_once(text, old_commands, new_commands, f'{path}: commands')
              text = text.replace(
                  '/sal or /sal status — show SAL status without advancing the story',
                  '/sal or /sal status — show SAL status without advancing SAL story turns'
              )
              text = text.replace(
                  '/sal stop or /stop — cancel a pending SAL generation',
                  '/sal stop or /stop — cancel a pending SAL generation'
              )
              path.write_text(text)

          # Input: never return stop:true on Phoenix. Skip Inner Self on utility commands.
          for path in [Path('SAL-only/input.js'), Path('src/input.js')]:
              text = path.read_text().replace('v1.3.3', 'v1.3.4')
              old = '''const salInput = SAL_state();\nif (SAL_hasInnerSelf() && !SAL_isBusy() && !salInput.inputStop) {\n  InnerSelf("input");\n}\n\nconst modifier = (text) => {\n  return {\n    text,\n    stop: salInput.inputStop === true\n  };\n};\n'''
              new = '''const salInput = SAL_state();\nif (SAL_hasInnerSelf() && !SAL_isBusy() && !salInput.commandPending) {\n  InnerSelf("input");\n}\n\nconst modifier = (text) => {\n  return { text };\n};\n'''
              text = replace_once(text, old, new, f'{path}: Phoenix input')
              path.write_text(text)

          # Context: utility commands get a tiny isolated model context and bypass both systems.
          for path in [Path('SAL-only/context.js'), Path('src/context.js')]:
              text = path.read_text().replace('v1.3.3', 'v1.3.4')
              old = '''if (SAL_isBusy()) {\n  // SAL owns this private planning call.\n  if (state.InnerSelf) state.InnerSelf.agent = "";\n  sal.innerSelfTaskActive = false;\n  text = SAL_generationContext(text);\n} else {\n'''
              new = '''if (sal.commandPending) {\n  // Phoenix has no clean no-model command path: stop:true throws an error and\n  // state.message is not implemented. Use one tiny hidden model call, then\n  // replace its Output with the command response.\n  if (state.InnerSelf) state.InnerSelf.agent = "";\n  sal.innerSelfTaskActive = false;\n  globalThis.stop = false;\n  text = "SAL utility command. Reply with OK only.";\n} else if (SAL_isBusy()) {\n  // SAL owns this private planning call.\n  if (state.InnerSelf) state.InnerSelf.agent = "";\n  sal.innerSelfTaskActive = false;\n  text = SAL_generationContext(text);\n} else {\n'''
              text = replace_once(text, old, new, f'{path}: command context')
              path.write_text(text)

          # Output: swallow the hidden generation and show the command result without counting a story turn.
          for path in [Path('SAL-only/output.js'), Path('src/output.js')]:
              text = path.read_text().replace('v1.3.3', 'v1.3.4')
              old = '''if (sal.captureGeneration) {\n  // This model output is SAL's private eight-beat planning response.\n  if (state.InnerSelf) state.InnerSelf.agent = "";\n  text = SAL_processGeneratedOutput(text);\n} else if (SAL_hasInnerSelf() && sal.innerSelfTaskActive) {\n'''
              new = '''if (sal.commandPending) {\n  // Swallow the unavoidable Phoenix command generation. Do not advance SAL's\n  // story counter and do not let Inner Self consume this utility turn.\n  text = String(sal.commandResponse || "SAL command completed.");\n  sal.commandPending = false;\n  sal.commandResponse = "";\n  sal.realPlayerInputThisTurn = false;\n  sal.innerSelfTaskActive = false;\n} else if (sal.captureGeneration) {\n  // This model output is SAL's private eight-beat planning response.\n  if (state.InnerSelf) state.InnerSelf.agent = "";\n  text = SAL_processGeneratedOutput(text);\n} else if (SAL_hasInnerSelf() && sal.innerSelfTaskActive) {\n'''
              text = replace_once(text, old, new, f'{path}: command output')
              path.write_text(text)

          # README wording for current Phoenix behavior.
          p = Path('README.md')
          readme = p.read_text().replace('SAL) v1.3.3', 'SAL) v1.3.4')
          old = '''SAL recognizes its commands in AI Dungeon's Story, Do, and Say input formats, including third-person character-name wrappers. Status/help/stop commands are intercepted without calling the story model, so they do not advance the story.\n\n- `/sal` or `/sal status` — show SAL status and the current Story Arc without advancing the story.\n- `/sal help` — show the SAL command list without advancing the story.\n- `/sal redo`, `/sal refresh`, or `/redo arc` — request a fresh Story Arc immediately.\n- `/sal stop` or `/stop` — cancel a pending SAL generation without advancing the story.\n'''
          new = '''SAL recognizes its commands in AI Dungeon's Story, Do, and Say input formats, including third-person character-name wrappers. On the current Phoenix client, `stop: true` produces a script error and `state.message` is not implemented, so display-only commands use one tiny hidden model call and replace its output with the SAL response. These utility commands do **not** increment SAL's story-turn counter or run Inner Self.\n\n- `/sal` or `/sal status` — show SAL status and the current Story Arc without incrementing SAL story turns.\n- `/sal help` — show the SAL command list.\n- `/sal redo`, `/sal refresh`, or `/redo arc` — request a fresh Story Arc immediately.\n- `/sal stop` or `/stop` — cancel a pending SAL generation.\n'''
          if old not in readme:
              raise RuntimeError('README command block not found')
          p.write_text(readme.replace(old, new, 1))
          PY

      - name: Verify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in SAL-only/library.js SAL-only/input.js SAL-only/context.js SAL-only/output.js src/library.js src/input.js src/context.js src/output.js; do
            node --check "$f"
          done
          ! grep -q 'stop: salInput.inputStop' SAL-only/input.js
          ! grep -q 'stop: salInput.inputStop' src/input.js
          grep -q 'const SAL_VERSION = "1.3.4"' SAL-only/library.js
          grep -q 'Story Arc Light (SAL) v1.3.4' src/library.js

      - name: Test Phoenix command lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/test-sal-phoenix.js <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          const library = fs.readFileSync('SAL-only/library.js', 'utf8');
          const hooks = {
            input: fs.readFileSync('SAL-only/input.js', 'utf8'),
            context: fs.readFileSync('SAL-only/context.js', 'utf8'),
            output: fs.readFileSync('SAL-only/output.js', 'utf8'),
          };

          function env() {
            return { state: {}, storyCards: [], history: [], info: { actionCount: 0, maxChars: 12000, memoryLength: 0 } };
          }

          function run(e, hook, text) {
            const ctx = {
              state: e.state,
              storyCards: e.storyCards,
              history: e.history,
              info: e.info,
              text,
              console,
              log: () => {},
              addStoryCard(keys, entry, type) {
                ctx.storyCards.push({ id: ctx.storyCards.length + 1, keys, entry, type });
                return ctx.storyCards.length - 1;
              },
              updateStoryCard(index, keys, entry, type) {
                ctx.storyCards[index] = { ...ctx.storyCards[index], keys, entry, type };
                return true;
              },
              removeStoryCard(index) { ctx.storyCards.splice(index, 1); },
            };
            ctx.globalThis = ctx;
            vm.createContext(ctx);
            vm.runInContext(library + '\n' + hooks[hook], ctx);
            e.state = ctx.state;
            e.storyCards = ctx.storyCards;
            return ctx;
          }

          const wrappers = cmd => [
            cmd,
            `> You ${cmd}.`,
            `> You say, "${cmd}"`,
            `> Sean ${cmd}.`,
            `> Sean says, "${cmd}"`,
            `> Sean K.I.A. ${cmd}.`,
            `> Sean K.I.A. says, "${cmd}"`,
          ];

          for (const cmd of ['/sal', '/sal status', '/sal help', '/sal stop', '/stop']) {
            for (const wrapped of wrappers(cmd)) {
              const e = env();
              const before = e.state.SAL?.turn || 0;
              let r = run(e, 'input', wrapped);
              assert.strictEqual(r.SAL_normalizeCommand(wrapped), cmd);
              assert.ok(r.text && r.text.length > 0, `${wrapped}: Input must stay non-empty`);
              assert.notStrictEqual(r.stop, true, `${wrapped}: must never return stop:true`);
              assert.strictEqual(e.state.SAL.commandPending, true);

              r = run(e, 'context', 'ordinary story context');
              assert.strictEqual(r.text, 'SAL utility command. Reply with OK only.');
              assert.notStrictEqual(r.stop, true);

              r = run(e, 'output', 'This hidden generation must be swallowed.');
              assert.strictEqual(e.state.SAL.commandPending, false);
              assert.strictEqual(e.state.SAL.turn, before, `${wrapped}: utility command advanced SAL turn`);
              if (cmd === '/sal' || cmd === '/sal status') assert.ok(r.text.includes('Story Arc Light 1.3.4'));
              if (cmd === '/sal help') assert.ok(r.text.includes('/sal redo'));
              if (cmd === '/sal stop' || cmd === '/stop') assert.ok(r.text.includes('No Story Arc Light generation'));
            }
          }

          // Redo aliases intentionally use a private planning model call, not the display-command path.
          for (const cmd of ['/sal redo', '/sal refresh', '/redo arc']) {
            for (const wrapped of wrappers(cmd)) {
              const e = env();
              let r = run(e, 'input', wrapped);
              assert.notStrictEqual(r.stop, true);
              assert.strictEqual(e.state.SAL.commandPending, false);
              assert.strictEqual(e.state.SAL.captureGeneration, true);
              r = run(e, 'context', 'story context');
              assert.ok(r.text.includes('Create ONLY a numbered list of exactly 8'));
              const arc = Array.from({length: 8}, (_, i) => `${i+1}. Possibility ${i+1}`).join('\n');
              r = run(e, 'output', arc);
              assert.ok(r.text.includes('updated and saved'));
              assert.ok(e.state.SAL.arc.includes('1. Possibility 1'));
              assert.strictEqual(e.state.SAL.turn, 0);
            }
          }

          // Ordinary prose mentioning commands must not be intercepted.
          for (const prose of [
            '> You tell Bob to type /sal status.',
            '> Sean explains that /sal redo can rebuild the arc.',
            'I tell her that the command is /stop.',
          ]) {
            const e = env();
            const r = run(e, 'input', prose);
            assert.strictEqual(r.SAL_normalizeCommand(prose), '');
            assert.strictEqual(e.state.SAL.commandPending, false);
            assert.strictEqual(r.text, prose);
          }

          // Normal story flow still increments SAL and first auto arc waits until turn 10.
          {
            const e = env();
            for (let i = 1; i <= 9; i++) {
              const r = run(e, 'output', `Story ${i}`);
              assert.strictEqual(e.state.SAL.turn, i);
              assert.strictEqual(e.state.SAL.captureGeneration, false);
            }
            const r = run(e, 'output', 'Story 10');
            assert.strictEqual(e.state.SAL.turn, 10);
            assert.strictEqual(e.state.SAL.captureGeneration, true);
            assert.ok(r.text.includes('will update next turn'));
          }

          console.log('All Phoenix SAL command tests passed');
          NODE
          node /tmp/test-sal-phoenix.js

      - name: Commit SAL v1.3.4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add SAL-only src README.md
          git commit -m 'Fix SAL commands for current Phoenix scripting behavior'
          git push
