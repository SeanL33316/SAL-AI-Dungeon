name: Fix SAL v1.3.3 workflow

on:
  push:
    paths:
      - '.github/workflows/fix-sal-v1.3.3-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct version replacement
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/sal-v1.3.3-command-fix.yml')
          text = p.read_text()
          old = "              text = text.replace('v1.3.2', 'v1.3.3')\n"
          new = old + "              text = text.replace('const SAL_VERSION = \\\"1.3.2\\\";', 'const SAL_VERSION = \\\"1.3.3\\\";')\n"
          if old not in text:
              raise RuntimeError('version replacement line not found')
          p.write_text(text.replace(old, new, 1))
      - name: Commit workflow correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add .github/workflows/sal-v1.3.3-command-fix.yml
          git commit -m 'Fix SAL 1.3.3 internal version update'
          git push
