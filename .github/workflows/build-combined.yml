name: Build combined Inner Self + SAL

on:
  push:
    paths:
      - '.github/workflows/build-combined.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve SAL-only copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SAL-only
          cp src/library.js SAL-only/library.js
          cp src/input.js SAL-only/input.js
          cp src/context.js SAL-only/context.js
          cp src/output.js SAL-only/output.js

      - name: Download official Inner Self source and license
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/LewdLeah/Inner-Self/main/src/library.js' -o /tmp/inner-self-library.js
          curl -fsSL 'https://raw.githubusercontent.com/LewdLeah/Inner-Self/main/LICENSE' -o LICENSE-INNER-SELF

      - name: Build paste-ready combined tabs
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '// ============================================================================'
            echo '// INNER SELF + SAL — COMBINED AI DUNGEON LIBRARY'
            echo '// ============================================================================'
            echo '// Included scripts:'
            echo '//   Inner Self v1.0.2 — LewdLeah'
            echo '//   Auto-Cards v1.1.3 — LewdLeah (included with Inner Self)'
            echo '//   Story Arc Light (SAL) v1.3.0 — SeanL33316'
            echo '//'
            echo "// This Library tab contains the full official Inner Self library. SAL's core is"
            echo '// embedded in each combined Input / Context / Output file so all four tabs are'
            echo '// ready to copy and paste without manual merging.'
            echo '// ============================================================================'
            echo
            cat /tmp/inner-self-library.js
          } > src/library.js

          build_hook() {
            hook="$1"
            title="$2"
            {
              echo '// ============================================================================'
              echo "// INNER SELF + SAL — COMBINED AI DUNGEON ${title}"
              echo '// ============================================================================'
              echo '// Inner Self v1.0.2 — LewdLeah'
              echo '// Story Arc Light (SAL) v1.3.0 — SeanL33316'
              echo '// Copy this entire file into the matching AI Dungeon scripting tab.'
              echo '// ============================================================================'
              echo
              sed 's#// Paste this entire file into the Library tab.#// SAL core embedded in this combined modifier.#' SAL-only/library.js
              echo
              cat "SAL-only/${hook}.js"
            } > "src/${hook}.js"
          }

          build_hook input INPUT
          build_hook context CONTEXT
          build_hook output OUTPUT

      - name: Verify generated JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check src/library.js
          node --check src/input.js
          node --check src/context.js
          node --check src/output.js
          node --check SAL-only/library.js
          node --check SAL-only/input.js
          node --check SAL-only/context.js
          node --check SAL-only/output.js
          grep -q 'function InnerSelf' src/library.js
          grep -q 'function AutoCards' src/library.js
          grep -q 'SAL_VERSION = "1.3.0"' src/input.js
          grep -q 'SAL_VERSION = "1.3.0"' src/context.js
          grep -q 'SAL_VERSION = "1.3.0"' src/output.js

      - name: Commit combined package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add src SAL-only LICENSE-INNER-SELF
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add paste-ready Inner Self + SAL combined package'
          git push
