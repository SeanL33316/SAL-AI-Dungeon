name: Fix SAL v1.3.5 patch version

on:
  push:
    paths:
      - '.github/workflows/fix-sal-135-patch-version.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix internal version replacement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/sal_135_patch.py')
          text = p.read_text()
          needle = "text = text.replace('v1.3.4', 'v1.3.5')\n"
          replacement = needle + "text = text.replace('const SAL_VERSION = \\\"1.3.4\\\";', 'const SAL_VERSION = \\\"1.3.5\\\";')\n"
          if needle not in text:
              raise RuntimeError('version replacement marker not found')
          p.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Commit patch script fix
        run: |
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add .github/scripts/sal_135_patch.py
          git commit -m 'Fix SAL 1.3.5 internal version patch'
          git push
