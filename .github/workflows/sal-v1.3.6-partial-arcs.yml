name: SAL v1.3.6 partial arcs

on:
  push:
    paths:
      - '.github/workflows/sal-v1.3.6-partial-arcs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply SAL v1.3.6
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(text, start_marker, end_marker, new_block, label):
              start = text.find(start_marker)
              if start < 0:
                  raise RuntimeError(f'{label}: start marker not found')
              end = text.find(end_marker, start)
              if end < 0:
                  raise RuntimeError(f'{label}: end marker not found')
              return text[:start] + new_block.rstrip() + '\n\n' + text[end:]

          new_parser = r'''function SAL_extractArcResult(text) {
            let raw = String(text || "")
              .replace(/\r/g, "")
              .replace(/<br\s*\/?\s*>/gi, "\n")
              .trim();
            raw = raw.replace(/^```[A-Za-z0-9_-]*\s*/i, "").replace(/\s*```$/i, "").trim();

            const makeResult = (items) => {
              const clean = items.map(SAL_cleanArcItem).filter(Boolean).slice(0, 8);
              if (clean.length < SAL_MIN_ARC_ITEMS) return null;
              return {
                count: clean.length,
                numbered: clean.map((item, index) => `${index + 1}. ${item}`).join("\n")
              };
            };

            let bestCount = 0;

            const jsonCandidates = [raw];
            const firstBracket = raw.indexOf("[");
            const lastBracket = raw.lastIndexOf("]");
            if (firstBracket >= 0 && lastBracket > firstBracket) {
              jsonCandidates.push(raw.slice(firstBracket, lastBracket + 1));
            }

            for (const candidate of jsonCandidates) {
              try {
                const parsed = JSON.parse(candidate);
                if (Array.isArray(parsed)) {
                  const clean = parsed.map(SAL_cleanArcItem).filter(Boolean);
                  bestCount = Math.max(bestCount, Math.min(8, clean.length));
                  const result = makeResult(clean);
                  if (result) return result;
                }
              } catch (_) {}
            }

            const numberedRaw = raw.replace(/\[\s*([1-8])\s*\]/g, "$1.");
            const markerRegex = /(^|[\n\r]|\s)(?:[-*•]\s*)?(?:\*\*)?([1-8])\s*(?:[.)\:：\-–—])(?:\*\*)?\s+/g;
            const markers = [];
            let match;
            while ((match = markerRegex.exec(numberedRaw)) !== null) {
              markers.push({
                number: Number(match[2]),
                markerStart: match.index + match[1].length,
                bodyStart: markerRegex.lastIndex
              });
            }

            let sequence = [];
            let bestSequence = [];
            for (const marker of markers) {
              if (marker.number === 1) {
                sequence = [marker];
              } else if (sequence.length && marker.number === sequence.length + 1) {
                sequence.push(marker);
              }

              if (sequence.length > bestSequence.length) bestSequence = sequence.slice();
              bestCount = Math.max(bestCount, Math.min(8, sequence.length));
              if (bestSequence.length >= 8) break;
            }

            if (bestSequence.length >= SAL_MIN_ARC_ITEMS) {
              const items = bestSequence.map((marker, index) => {
                const end = index < bestSequence.length - 1
                  ? bestSequence[index + 1].markerStart
                  : numberedRaw.length;
                return SAL_cleanArcItem(numberedRaw.slice(marker.bodyStart, end));
              }).filter(Boolean);
              const result = makeResult(items);
              if (result) return result;
            }

            const lines = raw.split("\n").map(line => line.trim()).filter(Boolean);

            const bullets = lines
              .map(line => line.match(/^[-*•]\s+(.+)/))
              .filter(Boolean)
              .map(match => SAL_cleanArcItem(match[1]))
              .filter(Boolean);
            bestCount = Math.max(bestCount, Math.min(8, bullets.length));
            const bulletResult = makeResult(bullets);
            if (bulletResult) return bulletResult;

            const plain = lines.filter(line => {
              if (/^(?:story arc|future possibilities|outline|here(?:'s| is))/i.test(line)) return false;
              const words = line.split(/\s+/).filter(Boolean).length;
              return words >= 2 && words <= 14 && line.length <= 180;
            });
            bestCount = Math.max(bestCount, Math.min(8, plain.length));
            if (lines.length <= 12) {
              const plainResult = makeResult(plain);
              if (plainResult) return plainResult;
            }

            return { count: Math.min(8, bestCount), numbered: "" };
          }'''

          new_process = r'''function SAL_processGeneratedOutput(outputText) {
            const s = SAL_state();
            const parsed = SAL_extractArcResult(outputText);
            const numbered = parsed.numbered;
            s.lastArcRecognizedItems = parsed.count;

            if (numbered && parsed.count >= SAL_MIN_ARC_ITEMS) {
              s.arc = SAL_softArcText(numbered);
              s.pendingGeneration = false;
              s.captureGeneration = false;
              s.attempt = 0;
              s.deferred = false;
              s.generationReason = "";
              s.nextArcTurn = s.turn + s.turnsPerAICall;
              s.lastArcGenerationStatus = `success (${parsed.count} possibilities)`;
              SAL_saveArc();
              return `<< ✅ Story Arc Light updated with ${parsed.count} possibilities. Continue playing normally. >>`;
            }

            const hadArc = Boolean(String(s.arc || "").trim());
            s.pendingGeneration = false;
            s.captureGeneration = false;
            s.attempt = 0;
            s.deferred = false;
            s.generationReason = "";

            // Do not interrupt the player with a quick automatic retry. A failed
            // planning call waits the full normal refresh interval before SAL
            // tries automatically again. Manual /sal redo remains available.
            s.nextArcTurn = s.turn + s.turnsPerAICall;
            s.lastArcGenerationStatus = `kept existing arc (${parsed.count}/8 recognized; minimum ${SAL_MIN_ARC_ITEMS})`;

            try {
              log(`SAL arc parse below minimum: recognized ${parsed.count}/8 items. Raw model output: ` + String(outputText || "").slice(0, 1600));
            } catch (_) {}

            return hadArc
              ? `<< ⚠️ Story Arc Light only found ${parsed.count}/8 usable possibilities, below the minimum of ${SAL_MIN_ARC_ITEMS}. The existing arc was kept. SAL will wait for the normal refresh interval; use '/sal redo' only if you want to try again sooner. >>`
              : `<< ⚠️ Story Arc Light only found ${parsed.count}/8 usable possibilities, below the minimum of ${SAL_MIN_ARC_ITEMS}. No arc was saved. SAL will wait for the normal refresh interval; use '/sal redo' only if you want to try again sooner. >>`;
          }'''

          for file_name in ['SAL-only/1-Library.js', 'src/1-Library.js']:
              path = Path(file_name)
              text = path.read_text()
              text = text.replace('v1.3.5', 'v1.3.6')
              text = text.replace('const SAL_VERSION = "1.3.5";', 'const SAL_VERSION = "1.3.6";')
              text = text.replace('const SAL_FAILED_RETRY_COOLDOWN = 5;', 'const SAL_MIN_ARC_ITEMS = 5;')
              text = replace_between(text, 'function SAL_extractArcResult(text) {', 'function SAL_extractNumberedArc(text) {', new_parser, file_name + ' parser')
              text = replace_between(text, 'function SAL_processGeneratedOutput(outputText) {', 'function SAL_onNormalOutput(outputText) {', new_process, file_name + ' output')
              text = text.replace(
                  '`Last arc generation: ${s.lastArcGenerationStatus}`,' ,
                  '`Minimum usable arc: ${SAL_MIN_ARC_ITEMS} possibilities`,\n    `Last arc generation: ${s.lastArcGenerationStatus}`,'
              )
              path.write_text(text)

          for file_name in [
              'SAL-only/2-Input.js', 'SAL-only/3-Context.js', 'SAL-only/4-Output.js',
              'src/2-Input.js', 'src/3-Context.js', 'src/4-Output.js'
          ]:
              path = Path(file_name)
              path.write_text(path.read_text().replace('v1.3.5', 'v1.3.6'))

          readme = Path('README.md')
          text = readme.read_text().replace('v1.3.5', 'v1.3.6')
          text = text.replace(
              'The parser accepts common numbered, one-line, bracketed, bullet, JSON-array, and short-line formats. If a response is still unusable, SAL stops cleanly instead of entering a Continue/retry loop, keeps the old arc, records how many items it recognized, and tries automatically again later.',
              'The parser accepts common numbered, one-line, bracketed, bullet, JSON-array, and short-line formats. SAL saves any useful partial result containing **5–8 possibilities** instead of demanding a perfect 8/8. If fewer than 5 usable possibilities are returned, SAL keeps the old arc and waits the full normal refresh interval—there is no automatic retry loop.'
          )
          text = text.replace(
              '- Generates exactly **8 short, flexible future possibilities**.',
              '- Asks for **8 short, flexible future possibilities** and saves any useful result containing **5–8**.'
          )
          text = text.replace(
              '- Refreshes **35 story turns after the last saved arc** by default.',
              '- Refreshes **35 story turns after the last saved arc** by default. Failed/too-short planning calls also wait the normal 35-turn interval instead of retrying early.'
          )
          readme.write_text(text)
          PY

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in SAL-only/1-Library.js SAL-only/2-Input.js SAL-only/3-Context.js SAL-only/4-Output.js src/1-Library.js src/2-Input.js src/3-Context.js src/4-Output.js; do
            node --check "$f"
          done

      - name: Test partial arc behavior
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');

          global.state = {};
          global.storyCards = [];
          global.log = () => {};
          global.addStoryCard = (keys, entry, type) => {
            storyCards.push({ keys, entry, type });
            return storyCards.length - 1;
          };
          global.updateStoryCard = (index, keys, entry, type) => {
            storyCards[index] = { ...storyCards[index], keys, entry, type };
          };
          global.removeStoryCard = (index) => storyCards.splice(index, 1);

          vm.runInThisContext(fs.readFileSync('SAL-only/1-Library.js', 'utf8'));

          function arc(n, oneLine=false) {
            const items = Array.from({length:n}, (_,i) => `${i+1}. possibility ${i+1} develops naturally`);
            return oneLine ? items.join(' ') : items.join('\n');
          }

          for (const n of [5,6,7,8]) {
            const parsed = SAL_extractArcResult(arc(n, n === 7));
            assert.equal(parsed.count, n, `parser should accept ${n}`);
            assert.ok(parsed.numbered, `${n} should produce a saved arc`);
          }

          const four = SAL_extractArcResult(arc(4));
          assert.equal(four.count, 4);
          assert.equal(four.numbered, '');

          const s = SAL_state();
          s.turn = 78;
          s.turnsPerAICall = 35;
          s.arc = SAL_softArcText(arc(8));
          const oldArc = s.arc;

          let out = SAL_processGeneratedOutput(arc(7, true));
          assert.ok(out.includes('7 possibilities'));
          assert.ok(s.arc.includes('7. possibility 7'));
          assert.ok(!s.arc.includes('8. possibility 8'));
          assert.equal(s.nextArcTurn, 113);
          assert.equal(s.lastArcGenerationStatus, 'success (7 possibilities)');

          s.turn = 100;
          s.arc = oldArc;
          const beforeFailure = s.arc;
          out = SAL_processGeneratedOutput(arc(4));
          assert.equal(s.arc, beforeFailure, '4-item result must keep old arc');
          assert.equal(s.nextArcTurn, 135, 'failure must wait full 35 turns');
          assert.ok(s.lastArcGenerationStatus.includes('4/8'));
          assert.ok(out.includes('wait for the normal refresh interval'));

          s.turn = 101;
          s.pendingGeneration = false;
          s.captureGeneration = false;
          s.deferred = false;
          assert.equal(SAL_scheduleIfDue(), false, 'must not retry early');

          console.log('SAL v1.3.6 partial arc tests passed');
          NODE

      - name: Verify combined SAL core matches standalone
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          standalone = Path('SAL-only/1-Library.js').read_text()
          combined = Path('src/1-Library.js').read_text()
          marker = '// SAL — STORY ARC LIGHT — AI DUNGEON LIBRARY — v1.3.6'
          start = combined.find(marker)
          if start < 0:
              raise SystemExit('SAL marker missing from combined library')
          combined_sal = combined[start - len('// ============================================================================\n'):]
          if standalone.strip() not in combined_sal.strip():
              raise SystemExit('combined SAL core does not match standalone')
          PY

      - name: Commit SAL v1.3.6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add SAL-only src README.md
          git commit -m 'Accept useful partial SAL arcs without retry loops'
          git push
