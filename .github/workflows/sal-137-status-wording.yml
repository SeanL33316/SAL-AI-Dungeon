name: SAL 1.3.7 status wording

on:
  push:
    paths:
      - '.github/workflows/sal-137-status-wording.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix no-arc failure status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = '  s.lastArcGenerationStatus = `kept existing arc (${parsed.count}/8 recognized; minimum ${SAL_MIN_ARC_ITEMS})`;'
          new = '''  s.lastArcGenerationStatus = hadArc
            ? `kept existing arc (${parsed.count}/8 recognized; minimum ${SAL_MIN_ARC_ITEMS})`
            : `no arc saved (${parsed.count}/8 recognized; minimum ${SAL_MIN_ARC_ITEMS})`;'''
          for name in ['SAL-only/1-Library.js', 'src/1-Library.js']:
              p = Path(name)
              t = p.read_text()
              if old not in t:
                  raise SystemExit(name + ': status line missing')
              p.write_text(t.replace(old, new, 1))
          PY
          node --check SAL-only/1-Library.js
          node --check src/1-Library.js
          git config user.name 'SeanL33316'
          git config user.email '92255633+SeanL33316@users.noreply.github.com'
          git add SAL-only/1-Library.js src/1-Library.js
          git commit -m 'Clarify SAL status when no previous arc exists'
          git push
