name: SAL 1.3.9 verification
on:
  push:
    paths:
      - '.github/workflows/sal-139-verification.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check all SAL files
        run: |
          for file in SAL-only/*.js src/*.js; do node --check "$file"; done
      - name: Verify combined core is identical
        run: |
          python3 - <<'PY'
          from pathlib import Path
          standalone = Path('SAL-only/1-Library.js').read_text()
          combined = Path('src/1-Library.js').read_text()
          assert combined.endswith(standalone)
          assert 'Story Arc Light (SAL) v1.3.9' in combined
          print('Combined Library and SAL-only Library are in sync')
          PY
      - name: Test update messages, pacing and retry behavior
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          global.state = {};
          global.storyCards = [];
          global.history = [];
          global.info = {maxChars: 10000, memoryLength: 400, actionCount: 100};
          global.log = () => {};
          global.addStoryCard = (keys,entry,type) => { storyCards.push({keys,entry,type,title:keys,description:''}); return undefined; };
          global.updateStoryCard = (i,keys,entry,type) => { Object.assign(storyCards[i],{keys,entry,type}); return true; };
          vm.runInThisContext(fs.readFileSync('SAL-only/1-Library.js','utf8'));
          assert.equal(SAL_VERSION, '1.3.9');
          const s = SAL_state();
          const makeArc = n => Array.from({length:n},(_,i) => (i+1)+'. Consider an optional event number '+(i+1)).join('\n');
          s.turn = 100;
          assert.match(SAL_processGeneratedOutput(makeArc(5)), /SAL updated \(5\/8\)/);
          assert.equal(s.arcSavedTurn,100);
          assert.equal(s.nextArcTurn,135);
          assert.equal(SAL_beatInterval(),7);
          assert.ok(SAL_statusText().includes('Remove one beat every: 7 turns'));
          assert.equal(storyCards[SAL_findCardIndex(SAL_ARC_KEYS)].entry,s.arc);
          for(let k=0;k<6;k++)SAL_onNormalOutput('Narrative');
          assert.equal(s.arc.split('\n').filter(x=>/^\d+\. /.test(x)).length,5);
          SAL_onNormalOutput('Narrative');
          assert.equal(s.arc.split('\n').filter(x=>/^\d+\. /.test(x)).length,4);
          assert.equal(s.nextArcTurn,135);
          const t = 'A scene\n\n<< ⏳ SAL ready: Continue to refresh; other actions defer. >>\n<< ✓ SAL updated (7/8). >>';
          assert.ok(!SAL_cleanContextNoise(t).includes('SAL ready'));
          assert.ok(!SAL_cleanContextNoise(t).includes('SAL updated'));
          assert.equal(SAL_cleanContextNoise(t).trim(),'A scene');
          s.turn=200;
          assert.match(SAL_processGeneratedOutput(makeArc(8)),/SAL updated \(8\/8\)/);
          assert.equal(SAL_beatInterval(),5);
          for(let k=0;k<4;k++)SAL_onNormalOutput('Narrative');
          assert.equal(s.arc.split('\n').filter(x=>/^\d+\. /.test(x)).length,8);
          SAL_onNormalOutput('Narrative');
          assert.equal(s.arc.split('\n').filter(x=>/^\d+\. /.test(x)).length,7);
          s.turn = 300;
          assert.match(SAL_processGeneratedOutput('OK'),/SAL skipped \(0\/8\); old arc kept/);
          assert.equal(s.nextArcTurn,335);
          assert.equal(s.pendingGeneration,false);
          assert.equal(s.captureGeneration,false);
          for(let k=0;k<20;k++)SAL_onNormalOutput('Narrative');
          assert.equal(s.pendingGeneration,false,'must not retry before scheduled refresh');
          s.turn=400;
          assert.match(SAL_processGeneratedOutput(makeArc(6)),/SAL updated \(6\/8\)/);
          assert.equal(SAL_beatInterval(),6);
          const x=SAL_onNormalOutput('Story continues');
          assert.equal(x,'Story continues');
          assert.equal(s.nextArcTurn,435);
          console.log('SAL 1.3.9 scenario tests passed');
          NODE
